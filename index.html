<div class="modal" id="modal">

  <div class="modal-box">

    <h2 id="modalTitle">
      辣巷子會員

      onclick="closeModal()">
      關閉
    </button>

</div>

<script>

const LIFF_ID =
"2001570705-pQ8Z3m6N";

let memberData = {

  name:"會員",

  userId:"",

  balance:0,

  points:0,

  draws:0

};


/* LINE 初始化 */

async function initLIFF(){

  try{

    document.getElementById(
      "loadingText"
    ).innerText =

"正在連線 LINE 會員服務...";

await liff.init({
  liffId: LIFF_ID,
  withLoginOnExternalBrowser: true
});

    if(!liff.isLoggedIn()){

      document.getElementById(
        "loadingText"
      ).innerText =
        "正在開啟 LINE 登入…";

liff.login({
    redirectUri: window.location.origin + window.location.pathname
});

      return;

    }

    await loadMember();

    document.getElementById(
      "loading"
    ).style.display =
      "none";

  }catch(error){

    console.error(error);

    document.getElementById(
      "loadingText"
    ).innerHTML =
      "LINE 會員服務連線失敗<br><br>" +
      "<small>" +
      escapeHtml(
        error.message ||
        "請重新整理頁面"
      ) +
      "</small>";

  }

}


/* 取得會員 */

async function loadMember(){
  const accessToken = liff.getAccessToken();

  if(!accessToken){
    throw new Error("LINE 登入憑證取得失敗");
  }

  const response = await fetch(
    "https://tctjonrbvvfntiqzmdnp.supabase.co/functions/v1/member-api-v3",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":"sb_publishable_iTqqKGe0WKiv-lQ2NIkKrg_1GHytUDh"
      },
      body:JSON.stringify({
        accessToken:accessToken
      })
    }
  );

  const result = await response.json();

  if(!response.ok || !result.ok){
    throw new Error(result.error || "無法取得會員資料");
  }

  const m = result.member;

  memberData = {
    ...memberData,
    id:m.id || "",
    name:m.name || "LINE會員",
    userId:m.line_user_id || "",
    balance:Number(m.balance || 0),
    points:Number(m.points || 0),
    draws:Number(m.draws || 0),
    orders:Number(m.orders || 0),
    birthday:m.birthday || "",
    picture_url:m.picture_url || null,
    transactions:result.transactions || [],
    coupons:result.coupons || []
  };

  updateUI();

  return;    
  }



/* 儲存 */

function saveMember(){

  if(!memberData.userId){

    return;

  }

  localStorage.setItem(

    "laxiangzi_member_" +
    memberData.userId,

    JSON.stringify(memberData)

  );

}


/* 更新 */

function updateUI(){

  document.getElementById(
    "balance"
  ).innerText =
    "$" +
    Number(
      memberData.balance || 0
    );

  document.getElementById(
    "points"
  ).innerText =
    Number(
      memberData.points || 0
    );

  document.getElementById(
    "pointBar"
  ).style.width =
    Math.min(
      100,
      Number(
        memberData.points || 0
      ) * 10
    ) + "%";

  document.getElementById(
    "drawText"
  ).innerText =

    memberData.draws > 0

      ? "剩餘 " +
        memberData.draws +
        " 次抽獎"

      : "尚無抽獎次數";

  document.getElementById(
    "memberStatus"
  ).innerText =
    memberData.name +
    "（LINE會員）";

  saveMember();

}


/* 抽獎 */

function draw(){

  if(memberData.draws <= 0){

    show(

      "目前沒有抽獎次數",

      "消費後即可獲得抽獎機會！"

    );

    return;

  }

  memberData.draws--;

  const prizes = [

    "消費金 $5",

    "消費金 $10",

    "消費金 $20",

    "消費金 $50",

    "消費金 $100",

    "集點 1 點",

    "再接再厲"

  ];

  const prize =
    prizes[
      Math.floor(
        Math.random() *
        prizes.length
      )
    ];

  if(
    prize.startsWith("消費金")
  ){

    const money =
      parseInt(
        prize.replace(
          /\D/g,
          ""
        )
      );

    memberData.balance +=
      money;

  }

  if(
    prize === "集點 1 點"
  ){

    memberData.points =
      Math.min(
        10,
        memberData.points + 1
      );

  }

  updateUI();

  show(
    "🎉 恭喜中獎！",
    prize
  );

}


/* 集點 */

function pointsRule(){

  show(

    "⭐ 集點兌換規則",

    `
    <div class="member-info">
      消費滿指定金額即可累積集點。
    </div>

    <div class="member-info">
      集滿 <strong>10 點</strong>
      可兌換指定優惠。
    </div>

    <div class="member-info">
      實際兌換內容可由老闆後台設定。
    </div>
    `

  );

}


/* 優惠券 */

function coupon(){

  show(

    "🎁 我的優惠券",

    `
    <div class="coupon">
      <strong>新會員優惠</strong>
      新會員可享指定優惠
    </div>

    <div class="coupon">
      <strong>生日優惠</strong>
      生日月份可使用
    </div>

    <div class="coupon">
      <strong>活動優惠券</strong>
      店內活動期間發放
    </div>
    `

  );

}


/* 會員資料 */

function member(){

  show(

    "👤 辣巷子會員",

    `
    <div class="member-info">
      <strong>會員名稱</strong><br>
      ${escapeHtml(
        memberData.name
      )}
    </div>

    <div class="member-info">
      <strong>LINE User ID</strong><br>
      <small>
        ${escapeHtml(
          memberData.userId
        )}
      </small>
    </div>

    <div class="member-info">
      <strong>辣巷子消費金</strong><br>
      $${Number(
        memberData.balance || 0
      )}
    </div>

    <div class="member-info">
      <strong>集點</strong><br>
      ${Number(
        memberData.points || 0
      )} 點
    </div>
    `

  );

}


/* 老闆後台 */

function openAdmin(){

  show(

    "🔐 辣巷子老闆後台",

    `
    <div class="member-info">
      老闆後台目前尚未開放。
    </div>

    <div class="member-info">
      下一步會接上真正的管理員登入，
      並連接會員資料庫。
    </div>
    `

  );

}


/* Modal */

function show(
  title,
  content
){

  document.getElementById(
    "modalTitle"
  ).innerText =
    title;

  document.getElementById(
    "modalContent"
  ).innerHTML =
    content;

  document.getElementById(
    "modal"
  ).style.display =
    "flex";

}


function closeModal(){

  document.getElementById(
    "modal"
  ).style.display =
    "none";

}


function scrollTopPage(){

  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


function escapeHtml(
  value
){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


document
  .getElementById("modal")
  .addEventListener(
    "click",
    function(e){

      if(
        e.target === this
      ){

        closeModal();

      }

    }
  );


window.addEventListener(
  "load",
  initLIFF
);

</script>
