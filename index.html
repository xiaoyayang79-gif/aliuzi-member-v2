<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#650000">

<title>辣巷子重慶小麵｜會員中心</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#f5f5f5;
  color:#222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Microsoft JhengHei",
    Arial,
    sans-serif;
}

body{
  padding-bottom:90px;
}

button{
  border:0;
  font-family:inherit;
  cursor:pointer;
}

.loading{
  position:fixed;
  inset:0;
  background:#fff;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:25px;
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid #eee;
  border-top-color:#b40000;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin-bottom:20px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.loading-title{
  font-size:24px;
  font-weight:700;
}

.loading-sub{
  margin-top:10px;
  color:#888;
  line-height:1.6;
}

.loading-error{
  margin-top:18px;
  padding:14px;
  background:#fff5f5;
  color:#a00000;
  border-radius:12px;
  font-size:14px;
  line-height:1.6;
  max-width:340px;
  word-break:break-word;
}

header{
  background:
    linear-gradient(
      135deg,
      #260708,
      #8d0000,
      #c30000
    );
  color:#fff;
  padding:32px 20px 38px;
  border-radius:0 0 32px 32px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:68px;
  height:68px;
  border:2px solid rgba(255,255,255,.7);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:900;
  flex-shrink:0;
}

.brand-info{
  min-width:0;
}

.brand h1{
  margin:0;
  font-size:23px;
}

.brand p{
  margin:6px 0 0;
  opacity:.8;
}

.admin-btn{
  margin-left:auto;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.4);
  color:#fff;
  padding:10px 13px;
  border-radius:20px;
  white-space:nowrap;
}

.balance{
  margin-top:25px;
  padding:23px;
  border-radius:23px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);
}

.balance-title{
  font-size:16px;
  opacity:.9;
}

.balance-money{
  font-size:44px;
  font-weight:800;
  margin:3px 0;
}

.balance-note{
  opacity:.75;
}

.container{
  padding:25px 20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.card{
  background:#fff;
  border-radius:23px;
  padding:20px;
  box-shadow:0 4px 16px rgba(0,0,0,.06);
}

.icon{
  font-size:32px;
}

.card h2{
  margin:9px 0 6px;
  font-size:20px;
}

.card p{
  color:#777;
  margin:0 0 15px;
  min-height:22px;
}

.card button{
  width:100%;
  padding:13px 8px;
  border-radius:15px;
  font-size:16px;
  font-weight:700;
}

.red{
  background:#c71919;
  color:#fff;
}

.yellow{
  background:#ffb400;
  color:#111;
}

.black{
  background:#171717;
  color:#fff;
}

.progress{
  height:10px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
  margin:13px 0 15px;
}

.progress-bar{
  width:0;
  height:100%;
  background:#ffb400;
  transition:.3s;
}

.section-title{
  font-size:24px;
  font-weight:800;
  margin:32px 0 14px;
}

.transaction{
  background:#fff;
  border-radius:18px;
  padding:17px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.transaction small{
  color:#888;
}

.transaction-amount{
  font-weight:800;
  white-space:nowrap;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:76px;
  background:#fff;
  border-top:1px solid #eee;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:1000;
}

.bottom button{
  background:#fff;
  color:#777;
  font-size:13px;
}

.nav-icon{
  display:block;
  font-size:24px;
  margin-bottom:3px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:3000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  background:#fff;
  width:100%;
  max-width:430px;
  border-radius:27px;
  padding:25px;
  max-height:85vh;
  overflow:auto;
}

.modal-box h2{
  margin-top:0;
}

.modal-close{
  width:100%;
  margin-top:20px;
  padding:14px;
  border-radius:15px;
  background:#171717;
  color:#fff;
  font-size:17px;
}

.member-info{
  background:#f7f7f7;
  padding:16px;
  border-radius:17px;
  margin:11px 0;
  line-height:1.6;
}

.coupon{
  padding:17px;
  border:2px dashed #d00000;
  border-radius:17px;
  margin:11px 0;
}

.coupon strong{
  display:block;
  font-size:19px;
  margin-bottom:5px;
}

.primary{
  width:100%;
  padding:14px;
  border-radius:15px;
  background:#c71919;
  color:#fff;
  font-size:16px;
  font-weight:700;
}

@media(max-width:380px){

  .grid{
    gap:11px;
  }

  .card{
    padding:16px;
  }

  .brand h1{
    font-size:20px;
  }

  .admin-btn{
    padding:8px 9px;
    font-size:13px;
  }

  .logo{
    width:62px;
    height:62px;
    font-size:17px;
  }
}
</style>
</head>

<body>

<!-- ==================== 載入畫面 ==================== -->

<div id="loading" class="loading">

  <div class="spinner"></div>

  <div class="loading-title">
    LINE會員系統載入中…
  </div>

  <div
    class="loading-sub"
    id="loadingText">
    正在連線會員服務
  </div>

  <div
    id="loadingError"
    class="loading-error"
    style="display:none;">
  </div>

</div>


<!-- ==================== 頁首 ==================== -->

<header>

  <div class="brand">

    <div class="logo">
      辣巷子
    </div>

    <div class="brand-info">

      <h1>
        辣巷子重慶小麵
      </h1>

      <p>
        會員中心・消費回饋
      </p>

    </div>

    <button
      class="admin-btn"
      onclick="openAdmin()">
      老闆後台
    </button>

  </div>


  <div class="balance">

    <div class="balance-title">
      我的辣巷子消費金
    </div>

    <div
      class="balance-money"
      id="balance">
      $0
    </div>

    <div class="balance-note">
      僅限本店消費，不可提領
    </div>

  </div>

</header>


<!-- ==================== 主內容 ==================== -->

<main class="container">

  <div class="grid">

    <!-- 抽獎 -->

    <div class="card">

      <div class="icon">
        🎰
      </div>

      <h2>
        消費抽獎
      </h2>

      <p id="drawText">
        尚無抽獎次數
      </p>

      <button
        class="red"
        onclick="drawPrize()">
        開始抽獎
      </button>

    </div>


    <!-- 集點 -->

    <div class="card">

      <div class="icon">
        ⭐
      </div>

      <h2>
        集點
      </h2>

      <p>
        <span id="points">
          0
        </span>
        / 10 點
      </p>

      <div class="progress">

        <div
          id="pointBar"
          class="progress-bar">
        </div>

      </div>

      <button
        class="yellow"
        onclick="pointsRule()">
        兌換規則
      </button>

    </div>


    <!-- 優惠券 -->

    <div class="card">

      <div class="icon">
        🎁
      </div>

      <h2>
        優惠券
      </h2>

      <p>
        新會員、生日、活動券
      </p>

      <button
        class="black"
        onclick="coupon()">
        查看優惠
      </button>

    </div>


    <!-- 會員 -->

    <div class="card">

      <div class="icon">
        👤
      </div>

      <h2>
        會員
      </h2>

      <p id="memberStatus">
        LINE會員
      </p>

      <button
        class="black"
        onclick="member()">
        會員資料
      </button>

    </div>

  </div>


  <!-- ==================== 交易紀錄 ==================== -->

  <div class="section-title">
    📒 交易紀錄
  </div>

  <div id="transactions">

    <div class="transaction">

      <div>

        <strong>
          目前尚無交易紀錄
        </strong>

        <br>

        <small>
          消費後會顯示在這裡
        </small>

      </div>

      <div class="transaction-amount">
        —
      </div>

    </div>

  </div>

</main>


<!-- ==================== 底部導覽 ==================== -->

<div class="bottom">

  <button onclick="scrollTopPage()">

    <span class="nav-icon">
      ⌂
    </span>

    會員

  </button>


  <button onclick="drawPrize()">

    <span class="nav-icon">
      🎰
    </span>

    抽獎

  </button>


  <button onclick="coupon()">

    <span class="nav-icon">
      🎁
    </span>

    優惠

  </button>


  <button onclick="member()">

    <span class="nav-icon">
      👤
    </span>

    我的

  </button>

</div>


<!-- ==================== Modal ==================== -->

<div
  class="modal"
  id="modal">

  <div class="modal-box">

    <h2 id="modalTitle">
      辣巷子會員
    </h2>

    <div id="modalContent"></div>

    <button
      class="modal-close"
      onclick="closeModal()">
      關閉
    </button>

  </div>

</div>


<script>

/* =========================================================
   辣巷子會員中心
   ========================================================= */


/* ==================== 設定 ==================== */

/*
 * 注意：
 * 這個 LIFF ID 必須是 LINE Developers
 * 後台實際存在的 LIFF ID。
 */

const LIFF_ID =
  "2001570705-pQ8Z3m6N";


/*
 * Supabase Edge Function
 */

const MEMBER_API =
  "https://tctjonrbvvfntiqzmdnp.supabase.co/functions/v1/member-api-v3";


/*
 * Supabase Publishable Key
 */

const SUPABASE_KEY =
  "sb_publishable_iTqqKGe0WKiv-lQ2NIkKrg_1GHytUDh";


/* ==================== 會員資料 ==================== */

let memberData = {

  id:"",
  name:"LINE會員",
  userId:"",
  balance:0,
  points:0,
  draws:0,
  orders:0,
  birthday:"",
  picture_url:null,
  transactions:[],
  coupons:[]

};


/* ==================== 載入 ==================== */

async function initLIFF(){

  try{

    setLoading(
      "正在連線 LINE 會員服務..."
    );


    /*
     * 確認 LIFF SDK 是否成功載入
     */

    if(
      typeof liff === "undefined"
    ){

      throw new Error(
        "LINE LIFF SDK 載入失敗"
      );

    }


    /*
     * 初始化 LIFF
     */

    await liff.init({

      liffId:LIFF_ID,

      withLoginOnExternalBrowser:true

    });


    /*
     * 尚未登入
     */

    if(
      !liff.isLoggedIn()
    ){

      setLoading(
        "正在開啟 LINE 登入..."
      );


      /*
       * 使用目前網址登入
       */

      liff.login({

        redirectUri:
          window.location.href

      });


      return;

    }


    /*
     * 已登入
     */

    setLoading(
      "正在取得會員資料..."
    );


    await loadMember();


    /*
     * 更新畫面
     */

    updateUI();


    /*
     * 關閉載入畫面
     */

    hideLoading();


  }catch(error){

    console.error(
      "LIFF ERROR:",
      error
    );


    showLoadingError(
      error
    );

  }

}


/* ==================== 載入會員 ==================== */

async function loadMember(){

  /*
   * 取得 LINE Access Token
   */

  const accessToken =
    liff.getAccessToken();


  if(!accessToken){

    throw new Error(
      "LINE 登入憑證取得失敗"
    );

  }


  /*
   * 呼叫 Supabase
   */

  const response =
    await fetch(

      MEMBER_API,

      {

        method:"POST",

        headers:{

          "Content-Type":
            "application/json",

          "apikey":
            SUPABASE_KEY

        },

        body:JSON.stringify({

          accessToken:
            accessToken

        })

      }

    );


  /*
   * 取得回應
   */

  let result;

  try{

    result =
      await response.json();

  }catch(e){

    throw new Error(
      "會員 API 回應格式錯誤"
    );

  }


  /*
   * API 錯誤
   */

  if(
    !response.ok ||
    !result.ok
  ){

    throw new Error(

      result.error ||
      "無法取得會員資料"

    );

  }


  /*
   * 會員資料
   */

  const m =
    result.member || {};


  memberData = {

    ...memberData,

    id:
      m.id || "",

    name:
      m.name ||
      "LINE會員",

    userId:
      m.line_user_id ||
      "",

    balance:
      Number(
        m.balance || 0
      ),

    points:
      Number(
        m.points || 0
      ),

    draws:
      Number(
        m.draws || 0
      ),

    orders:
      Number(
        m.orders || 0
      ),

    birthday:
      m.birthday || "",

    picture_url:
      m.picture_url ||
      null,

    transactions:
      result.transactions ||
      [],

    coupons:
      result.coupons ||
      []

  };

}


/* ==================== 更新畫面 ==================== */

function updateUI(){

  /*
   * 消費金
   */

  document.getElementById(
    "balance"
  ).innerText =
    "$" +
    Number(
      memberData.balance || 0
    );


  /*
   * 集點
   */

  const points =
    Number(
      memberData.points || 0
    );


  document.getElementById(
    "points"
  ).innerText =
    points;


  document.getElementById(
    "pointBar"
  ).style.width =
    Math.min(
      100,
      points * 10
    ) +
    "%";


  /*
   * 抽獎
   */

  document.getElementById(
    "drawText"
  ).innerText =

    memberData.draws > 0

      ? "剩餘 " +
        memberData.draws +
        " 次抽獎"

      : "尚無抽獎次數";


  /*
   * 會員名稱
   */

  document.getElementById(
    "memberStatus"
  ).innerText =
    memberData.name +
    "（LINE會員）";


  /*
   * 交易紀錄
   */

  renderTransactions();

}


/* ==================== 交易紀錄 ==================== */

function renderTransactions(){

  const box =
    document.getElementById(
      "transactions"
    );


  const list =
    memberData.transactions ||
    [];


  if(!list.length){

    box.innerHTML = `

      <div class="transaction">

        <div>

          <strong>
            目前尚無交易紀錄
          </strong>

          <br>

          <small>
            消費後會顯示在這裡
          </small>

        </div>

        <div class="transaction-amount">
          —
        </div>

      </div>

    `;

    return;

  }


  box.innerHTML =
    list.map(

      item => {

        const title =
          item.title ||
          item.description ||
          "消費紀錄";


        const amount =
          Number(
            item.amount || 0
          );


        const date =
          item.created_at
            ? new Date(
                item.created_at
              ).toLocaleString(
                "zh-TW"
              )
            : "";


        return `

          <div class="transaction">

            <div>

              <strong>
                ${escapeHtml(title)}
              </strong>

              <br>

              <small>
                ${escapeHtml(date)}
              </small>

            </div>

            <div class="transaction-amount">
              ${amount >= 0 ? "+" : ""}
              ${amount}
            </div>

          </div>

        `;

      }

    ).join("");

}


/* ==================== 本地備份 ==================== */

function saveMember(){

  if(
    !memberData.userId
  ){

    return;

  }


  try{

    localStorage.setItem(

      "laxiangzi_member_" +
      memberData.userId,

      JSON.stringify(
        memberData
      )

    );

  }catch(error){

    console.warn(
      "localStorage 儲存失敗",
      error
    );

  }

}


/* ==================== 抽獎 ==================== */

function drawPrize(){

  if(
    memberData.draws <= 0
  ){

    show(

      "目前沒有抽獎次數",

      `

      <div class="member-info">

        消費後即可獲得抽獎機會！

      </div>

      `

    );

    return;

  }


  memberData.draws--;


  const prizes = [

    "消費金 $5",

    "消費金 $10",

    "消費金 $20",

    "消費金 $50",

    "消費金 $100",

    "集點 1 點",

    "再接再厲"

  ];


  const prize =
    prizes[
      Math.floor(
        Math.random() *
        prizes.length
      )
    ];


  /*
   * 消費金
   */

  if(
    prize.startsWith(
      "消費金"
    )
  ){

    const money =
      parseInt(
        prize.replace(
          /\D/g,
          ""
        ),
        10
      );


    memberData.balance +=
      money;

  }


  /*
   * 集點
   */

  if(
    prize ===
    "集點 1 點"
  ){

    memberData.points =
      Math.min(

        10,

        memberData.points + 1

      );

  }


  updateUI();

  saveMember();


  show(

    "🎉 恭喜中獎！",

    `

    <div class="member-info">

      <div style="
        font-size:30px;
        text-align:center;
        margin-bottom:10px;
      ">
        🎊
      </div>

      <div style="
        font-size:24px;
        font-weight:800;
        text-align:center;
      ">
        ${escapeHtml(prize)}
      </div>

    </div>

    `

  );

}


/* ==================== 集點規則 ==================== */

function pointsRule(){

  show(

    "⭐ 集點兌換規則",

    `

    <div class="member-info">

      消費滿指定金額即可累積集點。

    </div>

    <div class="member-info">

      集滿
      <strong>10 點</strong>
      可兌換指定優惠。

    </div>

    <div class="member-info">

      實際兌換內容可由老闆後台設定。

    </div>

    `

  );

}


/* ==================== 優惠券 ==================== */

function coupon(){

  const coupons =
    memberData.coupons ||
    [];


  if(
    !coupons.length
  ){

    show(

      "🎁 我的優惠券",

      `

      <div class="coupon">

        <strong>
          新會員優惠
        </strong>

        新會員可享指定優惠。

      </div>

      <div class="coupon">

        <strong>
          生日優惠
        </strong>

        生日月份可使用。

      </div>

      <div class="coupon">

        <strong>
          活動優惠券
        </strong>

        店內活動期間發放。

      </div>

      `

    );

    return;

  }


  const html =
    coupons.map(

      c => `

        <div class="coupon">

          <strong>
            ${escapeHtml(
              c.title ||
              c.name ||
              "優惠券"
            )}
          </strong>

          ${escapeHtml(
            c.description ||
            "可使用優惠券"
          )}

        </div>

      `

    ).join("");


  show(
    "🎁 我的優惠券",
    html
  );

}


/* ==================== 會員資料 ==================== */

function member(){

  show(

    "👤 辣巷子會員",

    `

    <div class="member-info">

      <strong>
        會員名稱
      </strong>

      <br>

      ${escapeHtml(
        memberData.name
      )}

    </div>


    <div class="member-info">

      <strong>
        LINE User ID
      </strong>

      <br>

      <small>
        ${escapeHtml(
          memberData.userId
        )}
      </small>

    </div>


    <div class="member-info">

      <strong>
        辣巷子消費金
      </strong>

      <br>

      $${Number(
        memberData.balance || 0
      )}

    </div>


    <div class="member-info">

      <strong>
        集點
      </strong>

      <br>

      ${Number(
        memberData.points || 0
      )}
      點

    </div>


    <div class="member-info">

      <strong>
        抽獎次數
      </strong>

      <br>

      ${Number(
        memberData.draws || 0
      )}
      次

    </div>

    `

  );

}

/* ==================== Modal ==================== */

function show(
  title,
  content
){

  document.getElementById(
    "modalTitle"
  ).innerText =
    title;


  document.getElementById(
    "modalContent"
  ).innerHTML =
    content;


  document.getElementById(
    "modal"
  ).style.display =
    "flex";

}


function closeModal(){

  document.getElementById(
    "modal"
  ).style.display =
    "none";

}


/* ==================== 回到頂端 ==================== */

function scrollTopPage(){

  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* ==================== HTML 安全處理 ==================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* ==================== 載入畫面 ==================== */

function setLoading(
  text
){

  const el =
    document.getElementById(
      "loadingText"
    );


  if(el){

    el.innerText =
      text;

  }

}


function hideLoading(){

  const loading =
    document.getElementById(
      "loading"
    );


  if(loading){

    loading.style.display =
      "none";

  }

}


function showLoadingError(
  error
){

  const text =
    error &&
    error.message

      ? error.message

      : "請重新整理頁面";


  setLoading(
    "LINE 會員服務連線失敗"
  );


  const errorBox =
    document.getElementById(
      "loadingError"
    );


  if(errorBox){

    errorBox.style.display =
      "block";


    errorBox.innerHTML =

      "<strong>錯誤：</strong><br>" +

      escapeHtml(
        text
      ) +

      "<br><br>" +

      "如果看到「LIFF app was not found」，" +

      "代表 LINE Developers 裡的 LIFF ID 尚未正確建立或目前 ID 不正確。";

  }

}


/* ==================== Modal 點外面關閉 ==================== */

document
  .getElementById("modal")
  .addEventListener(

    "click",

    function(e){

      if(
        e.target === this
      ){

        closeModal();

      }

    }

  );


/* ==================== 啟動 ==================== */

window.addEventListener(

  "load",

  function(){

    initLIFF();

  }

);

</script>
